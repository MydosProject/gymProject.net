apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymproject-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymproject
  template:
    metadata:
      labels:
        app: gymproject
    spec:
      containers:
      - name: gymproject-container
        image: mehmetevg/gymproject:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gymproject-svc
spec:
  type: NodePort
  selector:
    app: gymproject
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
