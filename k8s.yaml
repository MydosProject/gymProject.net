apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:18-alpine
        env:
        - name: POSTGRES_DB
          value: "no23db"
        - name: POSTGRES_USER
          value: "no23"
        - name: POSTGRES_PASSWORD
          value: "change_me"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-svc
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432


apiVersion: apps/v1
kind: Deployment
metadata:
  name: gymproject-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gymproject
  template:
    metadata:
      labels:
        app: gymproject
    spec:
      containers:
      - name: gymproject-container
        image: mehmetevg/gymproject:latest
        imagePullPolicy: Always
        env:
        
        - name: ConnectionStrings__DefaultConnection
          value: "Host=postgres-svc;Port=5432;Database=no23db;Username=no23;Password=change_me"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gymproject-svc
spec:
  type: NodePort
  selector:
    app: gymproject
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
